<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Job Tracker</title>
    <script>
      // Apply the saved or system theme before first paint, so dark mode never flashes light.
      // Keep in sync with src/lib/theme.js.
      ;(function () {
        var preference = 'system'
        try {
          preference = localStorage.getItem('job-tracker-theme') || 'system'
        } catch (e) {}
        var dark = preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1a1916' : '#f7f4ee')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

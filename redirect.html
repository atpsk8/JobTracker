<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in…</title>
    <style>
      :root {
        --paper: #f7f4ee;
        --ink: #1c1b19;
        --ink-2: #4a4741;
        --accent: #2f5d46;
        --on-accent: #fcfbf8;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1a1916;
          --ink: #ece7dd;
          --ink-2: #c4beb2;
          --accent: #8dbb9c;
          --on-accent: #14130f;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        padding: 2.5rem 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 26rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.5rem;
        font: 600 1.375rem/1.2 Georgia, serif;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--ink-2);
      }
      a.button {
        display: inline-block;
        padding: 0.4375rem 0.875rem;
        border: 1px solid var(--accent);
        border-radius: 2px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- Microsoft's sign-in page returns here. This stores the result and takes the user back to the
         Job Tracker page they left, which finishes signing in and starts the scan. Microsoft also
         loads it in a hidden frame to renew sign-ins, where it passes the result to the page. -->
    <main>
      <h1 id="title">Signing you in…</h1>
      <p id="message">Taking you back to Job Tracker.</p>
      <a id="back" class="button" href="/" hidden>Back to Job Tracker</a>
    </main>
    <script type="module">
      import { broadcastResponseToMainFrame } from '@azure/msal-browser/redirect-bridge'

      try {
        await broadcastResponseToMainFrame()
      } catch (err) {
        const code = err?.errorCode || err?.name || 'unknown'
        document.getElementById('title').textContent = 'Sign-in didn’t finish'
        document.getElementById('message').textContent = `Job Tracker didn’t receive a sign-in result from Microsoft (error code: ${code}). Go back and try again.`
        document.getElementById('back').hidden = false
      }
    </script>
  </body>
</html>
